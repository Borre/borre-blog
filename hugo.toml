baseURL = "https://eduardohc.cloud/"
languageCode = "en-us"
title = "Eduardo Hernández"
theme = "papermod"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
summaryLength = 25

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  env = "production"
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  tocopen = true
  comments = false
  DateFormat = "2 Jan 2006"

  [params.label]
    text = "EH"
    icon = "/images/favicon.png"
    iconHeight = 32

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/borre"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/ehernandezc"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/ehdz"

  [params.homeInfoParams]
    Title = "Eduardo Hernández"
    Content = """Engineering manager at **Huawei Cloud LATAM**. Writing about infrastructure, distributed systems, and what it takes to ship production-grade software at scale.

15+ years across software engineering, DevOps, sales engineering, and cloud strategy for Latin America. Self-taught, business-oriented, and I believe architecture conversations are better over good food.

Currently building cloud infrastructure, AI platforms, and the occasional side project that keeps the craft alive."""

  [[params.homeInfoParams.social]]
    name = "GitHub"
    url = "https://github.com/borre"
  [[params.homeInfoParams.social]]
    name = "LinkedIn"
    url = "https://linkedin.com/in/ehernandezc"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1_200
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 2
