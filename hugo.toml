baseURL = "https://bor.re/"
languageCode = "en-us"
title = "bor.re"
theme = "papermod"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
summaryLength = 25

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    style = "monokai"
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  env = "production"
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  tocopen = true
  comments = false
  DateFormat = "2 Jan 2006"

  [params.label]
    text = "bor.re"
    icon = "/images/favicon.png"
    iconHeight = 32

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/borre"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/ehernandezc"

  [params.homeInfoParams]
    Title = "Eduardo Hernández"
    Content = "Engineering manager at Huawei Cloud LATAM. Writing about infrastructure, distributed systems, and what it takes to ship production-grade software at scale."

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1_200
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 1
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 2
