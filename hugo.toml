baseURL = "https://eduardohc.cloud/"
languageCode = "en-us"
title = "Eduardo Hernández Cansino"
theme = "papermod"
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
summaryLength = 30

[pagination]
  pagerSize = 10

# Keep existing URLs: posts live at /:slug/ (e.g. /serverless-enterprise-ai-workshop-functiongraph/)
[permalinks]
  posts = "/:slug/"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[params]
  env = "production"
  author = "Eduardo Hernández Cansino"
  description = "Technology Executive | AI & Cloud Strategy | Former CTO, Huawei Cloud Latin America | Co-founder & CTO at Nireto."
  images = ["images/social-card.png"]
  mainSections = ["posts"]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowShareButtons = true
  ShareButtons = ["x", "linkedin"]
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false
  DateFormat = "Jan 2, 2006"

  # Home hero (layouts/home.html)
  [params.hero]
    eyebrow = "AI & Cloud Strategy"
    name = "Eduardo Hernández Cansino"
    headline = "Technology Executive | AI & Cloud Strategy | Former CTO, Huawei Cloud Latin America | Co-founder & CTO at Nireto"
    intro = "I solve business problems with technology. I lead AI & Cloud Strategy for the Public Sector in Mexico at Huawei, and I'm Co-founder & CTO of Nireto, where we're building AI agents for short-term rental hosts and property managers (currently in pilot). Before that I was CTO of Huawei Cloud Latin America. I've been building software for 15+ years. Here I write about cloud, enterprise AI, and building systems people can trust with real operations."

  [params.label]
    text = "Eduardo HC"
    icon = "/images/favicon.png"
    iconHeight = 28

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/borre"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/ehernandezc/"
  [[params.socialIcons]]
    name = "x"
    url = "https://x.com/borre"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1_000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[menu.main]]
  name = "Writing"
  url = "/posts/"
  weight = 1
[[menu.main]]
  name = "Tags"
  url = "/tags/"
  weight = 2
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 3
[[menu.main]]
  name = "Now"
  url = "/now/"
  weight = 4
[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 5
